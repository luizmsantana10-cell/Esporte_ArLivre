<section id="form">
    <h2> Cadastro de Atleta</h2>

    <form id="form-atleta" (submit)="salvar()"
    (reset)="limparDados()">
        <label for="nome">Nome Completo</label>
        <input type="text"
         name="nome"
          id="nome"
          [(ngModel)] = "nome"
           class="input01"
            maxlength="60"
             required placeholder="Digite o nome completo">

        <label for="cpf">CPF</label>
        <input type="text"
         name="cpf"
          id="cpf"
          [(ngModel)] = "cpf"
           class="input02"
            maxlength="14"
             required placeholder="Digite o CPF">

        <label for="sexo">Sexo</label>
        <input type="radio"
         name="sexo"
          id="sexoM"
          [(ngModel)] = "sexo"
          class="radio01" 
           required value="M"> Masculino

        <input type="radio"
         name="sexo"
          id="sexoF"
          [(ngModel)] = "sexo"
          class="radio01"
          required value="F"> Feminino

        <input type="radio" 
        name="sexo" 
        id="sexoN" 
        class="radio01"
        [(ngModel)] = "sexo" 
         required value="N"> Não Declarar

        <label for="rua-logradouro">Rua/Logradouro</label>
        <input type="text"
         name="rua-logradouro"
          id="rua-logradouro"
          [(ngModel)] = "ruaLogradouro"
           class="input01"
            maxlength="100"
             required placeholder="Digite sua rua ou Logradouro">

        <label for="bairro">Bairro</label>
        <input type="text"
         name="bairro"
          id="bairro"
          [(ngModel)] = "bairro" 
          class="input02" 
          maxlength="60"
           required placeholder="Digite o Bairro">

        <label for="cidade">Cidade</label>
        <input type="text"
         name="cidade" 
         id="cidade" 
         [(ngModel)] = "cidade"
         class="input02"
          maxlength="15"
           required placeholder="Digite a cidade">

           <label for="uf">UF</label>
        <input type="text"
         name="uf" 
         id="uf" 
         [(ngModel)] = "uf"
         class="input02"
          maxlength="2"
           required placeholder="Digite o UF">
         
         <div id="btn">
        <button type="submit" id="btnAdd"> Cadastar</button>
        <button type="reset" id="btnLimpar"> Limpar</button>
    </div>




    </form>
</section>
